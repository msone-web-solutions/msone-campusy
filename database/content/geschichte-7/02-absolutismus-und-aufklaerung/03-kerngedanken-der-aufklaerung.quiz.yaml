- key: q1
  type: single_choice
  prompt: "Was war nach Kant „Aufklärung“?"
  options: ["Das Ende aller Religion", "Der Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit", "Die Erfindung der Elektrizität", "Die Herrschaft der Könige"]
  answer: { index: 1 }
  explanation: "So beginnt Kants berühmter Aufsatz von 1784."
- key: q2
  type: multiple_choice
  prompt: "Welche Forderungen stellten die Aufklärer?"
  options: ["Gewaltenteilung", "Toleranz gegenüber anderen Religionen", "Stärkung des Gottesgnadentums", "Bildung für alle"]
  answer: { indexes: [0, 1, 3] }
  explanation: "Das Gottesgnadentum war genau das, was die Aufklärer ablehnten."
- key: q3
  type: single_choice
  prompt: "Was bedeutet Gewaltenteilung?"
  options: ["Der König teilt seine Macht mit dem Papst", "Gesetzgebung, Regierung und Rechtsprechung werden getrennt", "Das Heer wird in drei Teile geteilt", "Die Bürger dürfen Gewalt anwenden"]
  answer: { index: 1 }
  explanation: "Legislative, Exekutive und Judikative sollen sich gegenseitig kontrollieren."
- key: q4
  type: gap_text
  prompt: "Lessing zeigte in „Nathan der Weise“ mit der ___ die Gleichwertigkeit der drei Religionen."
  answer:
    gaps:
      - ["Ringparabel"]
  explanation: "Die Ringparabel steht für religiöse Toleranz."
- key: q5
  type: true_false
  prompt: "Die meisten Aufklärer wollten den Glauben an Gott komplett abschaffen."
  answer: { value: false }
  explanation: "Sie kritisierten Aberglauben und Kirchenmacht; viele glaubten als Deisten weiter an einen Schöpfergott."
- key: q6
