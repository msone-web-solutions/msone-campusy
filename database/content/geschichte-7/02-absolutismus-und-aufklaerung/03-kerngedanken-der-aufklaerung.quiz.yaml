  answer: { index: 1 }
  explanation: "Dorothea Erxleben aus Quedlinburg wurde 1754 in Halle zur Doktorin der Medizin promoviert."
- key: q7
  type: single_choice
  prompt: "Wo wurden die Ideen der Aufklärung unter Bürgern diskutiert?"
  options: ["Nur im Schloss des Königs", "In Kaffeehäusern, Salons und Lesegesellschaften", "Nur in Kirchen", "Im Fernsehen"]
  answer: { index: 1 }
  explanation: "Kaffeehäuser, Salons und Lesegesellschaften waren die Treffpunkte der aufgeklärten Bürger."
- key: q8
  type: single_choice
  prompt: "Welcher Gedanke der Aufklärung widersprach dem Absolutismus am stärksten?"
  options: ["Alle Menschen sind von Natur aus frei und gleich", "Der König hat einen schönen Garten", "Die Sonne ist der Mittelpunkt des Sonnensystems", "Kaffee ist gesund"]
  answer: { index: 0 }
  explanation: "Wenn alle gleich sind, gibt es keine Rechtfertigung für die Alleinherrschaft eines Königs."
