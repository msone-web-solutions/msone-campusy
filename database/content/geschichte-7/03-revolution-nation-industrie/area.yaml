name: Revolution, Nation und Industrie
description: Die Französische Revolution von 1789 bis Napoleon, die deutsche Nationalbewegung, die Reichsgründung unter Bismarck und die Entstehung der Industriegesellschaft mit der sozialen Frage.
curriculum_ref: "Fachlehrplan Sekundarschule Geschichte, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Die Französische Revolution als Aufbruch in die bürgerliche Gesellschaft“, „Nationalbewegung und Nationalstaatsbildung in Deutschland“ und „Die Entstehung der Industriegesellschaft“"
