- key: q1
  type: single_choice
  prompt: "In welchem Land begann die Industrialisierung?"
  options: ["Deutschland", "England", "Frankreich", "USA"]
  answer: { index: 1 }
  explanation: "England war ab etwa 1770 das „Mutterland der Industrie“."
- key: q2
  type: single_choice
  prompt: "Welche Maschine trieb die erste Phase der Industrialisierung an?"
  options: ["Der Elektromotor", "Die Dampfmaschine", "Der Verbrennungsmotor", "Das Wasserrad"]
  answer: { index: 1 }
  explanation: "James Watts verbesserte Dampfmaschine (1769) lief mit Kohle und konnte überall stehen."
- key: q3
