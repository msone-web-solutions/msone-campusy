- key: q5
  type: true_false
  prompt: "Bismarck verbot die Sozialdemokratie und führte gleichzeitig die Sozialversicherung ein."
  answer: { value: true }
  explanation: "Sozialistengesetz 1878 und Sozialversicherungen 1883–1889 – „Zuckerbrot und Peitsche“."
- key: q6
  type: single_choice
  prompt: "Welche Klasse entstand neu durch die Industrialisierung?"
  options: ["Der Adel", "Die Arbeiterschaft (Proletariat)", "Der Klerus", "Die Bauern"]
  answer: { index: 1 }
  explanation: "Arbeiter besaßen nur ihre Arbeitskraft und bildeten die neue Unterschicht der Klassengesellschaft."
- key: q7
  type: single_choice
  prompt: "Was war 1861 in Staßfurt eine Weltneuheit?"
  options: ["Die erste Zuckerfabrik", "Das erste Kalibergwerk der Welt", "Die erste Eisenbahn", "Die erste Dampfmaschine"]
  answer: { index: 1 }
  explanation: "In Staßfurt wurde erstmals Kalisalz für Kunstdünger abgebaut."
- key: q8
  type: multiple_choice
  prompt: "Welche Industriezweige waren typisch für das heutige Sachsen-Anhalt?"
