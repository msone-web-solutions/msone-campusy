  prompt: "Die erste deutsche Eisenbahn fuhr ___ von Nürnberg nach ___."
  answer:
    gaps:
      - ["1835"]
      - ["Fürth", "Fuerth"]
  explanation: "Am 7. Dezember 1835 fuhr der „Adler“ von Nürnberg nach Fürth."
- key: q4
  type: multiple_choice
  prompt: "Welche Probleme gehörten zur sozialen Frage?"
  options: ["Kinderarbeit", "Arbeitstage von 12 bis 16 Stunden", "Zu hohe Löhne", "Wohnungsnot in den Städten"]
  answer: { indexes: [0, 1, 3] }
