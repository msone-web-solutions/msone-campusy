name: Organsysteme und Stoffwechsel
description: Der Mensch als System aus Zellen, Geweben, Organen und Organsystemen; Ernährung und Verdauung, Atmung und Blutkreislauf, Skelett und Muskulatur.
curriculum_ref: "Fachlehrplan Sekundarschule Biologie, Schuljahrgänge 7/8 – Kompetenzschwerpunkt „System und Systemebenen am Beispiel des Menschen unter Einbeziehung seiner Umwelt erklären“ (Organe und Organsysteme, Stoff- und Energiewechsel, Einheit von Skelett und Muskulatur)"
