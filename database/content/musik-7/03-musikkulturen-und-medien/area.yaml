name: Musikkulturen und Medien
description: Gospel, Spiritual und Blues als Musik Amerikas mit afrikanischen Wurzeln; Filmmusik, Vermarktung von Musik und Urheberrecht.
curriculum_ref: "Fachlehrplan Sekundarschule Musik, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Musikkulturen der Welt entdecken“ (Musik aus Amerika, Musik aus Afrika) und „Musik im Medienkontext reflektieren und gestalten“ (Filmmusik, Vermarktung von Musik, Rechtsfragen)"
