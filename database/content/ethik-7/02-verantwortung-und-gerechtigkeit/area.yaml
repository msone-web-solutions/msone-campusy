name: Verantwortung und Gerechtigkeit
description: Moralische und rechtliche Verantwortung beim Erwachsenwerden, Achtung und Respekt, Egoismus und Altruismus; ausgleichende und austeilende Gerechtigkeit und Geschlechtergerechtigkeit.
curriculum_ref: "Fachlehrplan Sekundarschule Ethik, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Verantwortung: Eigenverantwortung in gesellschaftlichen Zusammenhängen“ und „Gerechtigkeit: Verschiedene Begriffe von Gerechtigkeit“"
