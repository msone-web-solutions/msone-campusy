name: Glück und Freiheit
description: Offene und versteckte Glücksversprechen, Bedürfnisse, Sucht und Willensfreiheit; negative und positive Freiheit, Toleranz, Formen von Gewalt und Wege der Konfliktlösung.
curriculum_ref: "Fachlehrplan Sekundarschule Ethik, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Glück: Glücksversprechungen“ und „Freiheit: Eigene Freiheit und die Freiheit anderer“"
