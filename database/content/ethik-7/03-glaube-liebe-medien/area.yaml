name: Glaube, Liebe und Medien
description: Religionen und ihre Deutungen des menschlichen Lebens, Glauben und Wissen; Formen der Liebe und sexuelle Selbstbestimmung; Chancen und Grenzen von Medien, Jugendschutz und Medienmacht.
curriculum_ref: "Fachlehrplan Sekundarschule Ethik, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Glaube: Religionen und ihre Deutungen menschlicher Existenz“, „Lebensgestaltung: Liebe und Sexualität“ und „Natur – Mensch – Technik: Chancen und Grenzen von Medien“"
