- key: q1
  type: multiple_choice
  prompt: "Welche Eigenschaften sind typisch für alle Metalle?"
  options: ["Glanz", "elektrische Leitfähigkeit", "Brennbarkeit", "Verformbarkeit", "Wärmeleitfähigkeit"]
  answer: { indexes: [0, 1, 3, 4] }
  explanation: "Glanz, elektrische und Wärmeleitfähigkeit, Verformbarkeit. Brennbarkeit ist keine allgemeine Metalleigenschaft."
- key: q2
  type: single_choice
  prompt: "Welches Metall leitet Strom am besten?"
  options: ["Eisen", "Silber", "Blei", "Zink"]
  answer: { index: 1 }
  explanation: "Silber ist der beste Leiter, danach Kupfer und Gold."
- key: q3
  type: single_choice
  prompt: "Welches Metall ist bei Raumtemperatur flüssig?"
  options: ["Aluminium", "Quecksilber", "Zinn", "Natrium"]
  answer: { index: 1 }
  explanation: "Quecksilber ist das einzige bei Raumtemperatur flüssige Metall."
- key: q4
  type: single_choice
  prompt: "Womit weist man im Labor nach, dass ein Stoff Strom leitet?"
  options: ["Mit dem Magneten", "Mit dem Leitfähigkeitsprüfer (Lämpchen leuchtet)", "Mit dem Brenner", "Mit der Waage"]
  answer: { index: 1 }
  explanation: "Leuchtet das Lämpchen im Stromkreis, leitet der Stoff."
- key: q5
  type: single_choice
  prompt: "Welches ist ein Nichtmetall?"
  options: ["Kupfer", "Schwefel", "Zink", "Gold"]
  answer: { index: 1 }
  explanation: "Schwefel ist gelb, spröde und leitet keinen Strom – ein Nichtmetall."
- key: q6
  type: gap_text
  prompt: "Gold und Silber sind ___ Metalle, Eisen und Magnesium sind ___ Metalle."
  answer:
    gaps:
      - ["edle"]
      - ["unedle"]
  explanation: "Edle Metalle reagieren kaum, unedle leicht mit Sauerstoff und Säuren."
- key: q7
  type: single_choice
  prompt: "Aluminium hat die Dichte 2,7 g/cm³. Es ist ein …"
  options: ["Schwermetall", "Leichtmetall", "Edelmetall", "Nichtmetall"]
  answer: { index: 1 }
  explanation: "Dichte unter 5 g/cm³ = Leichtmetall."
- key: q8
  type: true_false
  prompt: "Alle Metalle werden vom Magneten angezogen."
  answer: { value: false }
  explanation: "Nur Eisen, Nickel und Cobalt. Kupfer, Aluminium oder Gold nicht."
- key: q9
  type: single_choice
  prompt: "Warum wird Natrium unter Öl aufbewahrt?"
  options: ["Damit es glänzt", "Weil es sehr unedel ist und mit Luft und Wasser heftig reagiert", "Weil es flüssig ist", "Weil es giftig ist"]
  answer: { index: 1 }
  explanation: "Natrium ist extrem reaktionsfreudig – das Öl hält Luft und Feuchtigkeit fern."
- key: q10
  type: multiple_choice
  prompt: "Welche Schwermetalle sind giftig?"
  options: ["Blei", "Eisen", "Quecksilber", "Cadmium", "Kupfer"]
  answer: { indexes: [0, 2, 3] }
  explanation: "Blei, Quecksilber und Cadmium sind giftig. Eisen und Kupfer braucht der Körper sogar in kleinen Mengen."
- key: q11
  type: single_choice
  prompt: "Blattgold ist nur 0,0001 mm dick. Welche Metalleigenschaft macht das möglich?"
  options: ["Glanz", "Leitfähigkeit", "Verformbarkeit", "Dichte"]
  answer: { index: 2 }
  explanation: "Gold lässt sich extrem dünn hämmern – Verformbarkeit."
- key: q12
  type: single_choice
  prompt: "In einem Protokoll steht: „Lämpchen leuchtet, Draht lässt sich biegen.“ Was ist das?"
  options: ["Die Aufgabe", "Die Beobachtung", "Die Auswertung", "Die Vermutung"]
  answer: { index: 1 }
  explanation: "Das sind Beobachtungen. Die Auswertung wäre: „Der Draht ist ein Metall.“"
