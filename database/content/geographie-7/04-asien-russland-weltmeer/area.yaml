name: Asien, Russland, Weltmeer – Wirtschaftsräume und Nachhaltigkeit
description: Ost-, Süd- und Südostasien mit Monsun und Bevölkerungsentwicklung, China als aufstrebende Wirtschaftsmacht, Russland als Ressourcenraum, das Weltmeer und das Leitbild der Nachhaltigkeit.
curriculum_ref: "Fachlehrplan Sekundarschule Geographie, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Strukturen und Prozesse in Wirtschaftsräumen analysieren und erläutern“ (Ost-, Süd- und Südostasien, China) und „Räume unter dem Aspekt der Nachhaltigkeit analysieren“ (Russland, Weltmeer, Leitbild der Nachhaltigkeit)"
