- key: q1
  type: single_choice
  prompt: "Was kennzeichnet die Zone des tropischen Wechselklimas?"
  options: ["Vier Jahreszeiten", "Regenzeit und Trockenzeit bei ganzjähriger Wärme", "Ganzjährig Regen", "Ganzjährig Trockenheit"]
  answer: { index: 1 }
  explanation: "Wechselfeucht: der Regen kommt nur in einem Teil des Jahres."
- key: q2
  type: single_choice
  prompt: "Welche Savanne hat die längste Regenzeit?"
  options: ["Dornsavanne", "Trockensavanne", "Feuchtsavanne", "Alle gleich"]
  answer: { index: 2 }
  explanation: "Feuchtsavanne: 7–9 Monate Regen, nahe am Regenwald."
- key: q3
  type: gap_text
  prompt: "Der typische Baum der Trockensavanne ist der ___ (Affenbrotbaum). Der Sahel liegt ___ der Sahara."
