  answer: { index: 1 }
  explanation: "Wüstenbildung durch Zusammenwirken von Natur und Mensch."
- key: q5
  type: multiple_choice
  prompt: "Welche menschlichen Ursachen tragen zur Desertifikation bei?"
  options: ["Überweidung", "Brennholzeinschlag", "Aufforstung", "Übernutzung der Äcker ohne Brache"]
  answer: { indexes: [0, 1, 3] }
  explanation: "Aufforstung ist eine Gegenmaßnahme."
- key: q6
  type: single_choice
  prompt: "Welches Glied fehlt in der Kette? Überweidung → Boden ohne Pflanzendecke → ___ → Wüste wächst"
  options: ["Bodenerosion", "Aufforstung", "Regenzeit", "Stockwerkbau"]
  answer: { index: 0 }
  explanation: "Ohne Wurzeln trägt Wind und Starkregen den Boden ab."
- key: q7
  type: single_choice
  prompt: "Was ist die „Große Grüne Mauer“?"
