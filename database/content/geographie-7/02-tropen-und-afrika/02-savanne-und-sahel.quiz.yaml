  answer: { index: 1 }
  explanation: "Aufforstung gegen die Ausbreitung der Wüste."
- key: q8
  type: true_false
  prompt: "Im Klimadiagramm der Savanne verteilt sich der Regen gleichmäßig über alle Monate."
  answer: { value: false }
  explanation: "Der Regen konzentriert sich auf wenige Monate; die übrigen sind arid."
