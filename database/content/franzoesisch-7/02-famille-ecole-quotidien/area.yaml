name: Famille, école et quotidien – Familie, Schule und Alltag
description: "Über Familie, Schule und den Tagesablauf sprechen: être und avoir, Possessivbegleiter, Fragen und Verneinung, Zahlen und Uhrzeit."
curriculum_ref: "Fachlehrplan Sekundarschule Französisch, Schuljahrgänge 7/8 – kommunikative Inhalte „Eigene Person und soziales Umfeld“, „Schule“, „Tagesablauf“; sprachliche Mittel: unregelmäßige Verben, Possessivbegleiter, Fragebildung, Verneinung, Grund- und Ordnungszahlen, Zeitangaben"
