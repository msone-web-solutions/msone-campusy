name: Manger et découvrir la France – Essen und Frankreich entdecken
description: "Essen und Trinken mit Teilungsartikel und Mengenangaben sowie Landeskunde: Frankreich, Paris, Regionen, Feste und die Frankophonie."
curriculum_ref: "Fachlehrplan Sekundarschule Französisch, Schuljahrgänge 7/8 – kommunikative Inhalte „Essen, Trinken“, „Einkauf“, „Geografie und Kultur“; sprachliche Mittel: Teilungsartikel, Mengenangaben; soziokulturelles Orientierungswissen: Alltagskultur, Lage Frankreichs, Sehenswürdigkeiten, Frankophonie"
