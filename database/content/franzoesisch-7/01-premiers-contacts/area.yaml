name: Premiers contacts – erste Begegnungen
description: Begrüßen, sich vorstellen, Artikel und Plural, Personalpronomen und die Verben auf -er im Präsens – die ersten Schritte auf Französisch.
curriculum_ref: "Fachlehrplan Sekundarschule Französisch, Schuljahrgänge 7/8 – Kommunikationsabsichten „Kontakte aufnehmen“, „sich vorstellen“; sprachliche Mittel: bestimmter/unbestimmter Artikel, Singular-/Pluralbildung, Personalpronomen, présent der Verben auf -er"
