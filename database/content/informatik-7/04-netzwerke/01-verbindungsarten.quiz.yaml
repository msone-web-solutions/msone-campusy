- key: q1
  type: single_choice
  prompt: "Wofür steht LAN?"
  options: ["Large Area Network", "Local Area Network", "Long Antenna Network", "Laptop And Net"]
  answer: { index: 1 }
  explanation: "Lokales Netzwerk, meist per Kabel."
- key: q2
  type: single_choice
  prompt: "Welche Verbindung ist am schnellsten und stabilsten?"
  options: ["WLAN", "LAN-Kabel", "Bluetooth", "NFC"]
  answer: { index: 1 }
  explanation: "Kabel: keine Funkstörungen, höchstes Tempo."
- key: q3
  type: single_choice
  prompt: "Womit verbindet man Kopfhörer kabellos mit dem Handy?"
  options: ["LAN", "NFC", "Bluetooth", "Mobilfunk"]
  answer: { index: 2 }
  explanation: "Bluetooth: direkte Verbindung über wenige Meter."
- key: q4
  type: single_choice
  prompt: "Welche Reichweite hat NFC?"
  options: ["Wenige Zentimeter", "10 Meter", "50 Meter", "Kilometer"]
  answer: { index: 0 }
  explanation: "Near Field = Nahfeld."
- key: q5
  type: single_choice
  prompt: "Was braucht man, um sich mit einem WLAN zu verbinden?"
  options: ["Ein Kabel", "Netzwerkname (SSID) und Passwort", "Eine SIM-Karte", "Einen Drucker"]
  answer: { index: 1 }
  explanation: "SSID + Passwort."
- key: q6
  type: single_choice
  prompt: "Wozu dient ein Repeater?"
  options: ["Er macht das Internet schneller", "Er verlängert die Reichweite des WLANs", "Er ersetzt den Router", "Er speichert Daten"]
  answer: { index: 1 }
  explanation: "Er empfängt das WLAN und sendet es weiter."
- key: q7
  type: single_choice
  prompt: "Welche WLAN-Frequenz reicht weiter, ist aber langsamer?"
  options: ["2,4 GHz", "5 GHz"]
  answer: { index: 0 }
  explanation: "2,4 GHz kommt besser durch Wände, 5 GHz ist schneller."
- key: q8
  type: single_choice
