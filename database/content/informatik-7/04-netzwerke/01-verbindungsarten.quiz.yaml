  options: ["Über Bluetooth", "Über Mobilfunk (4G/5G)", "Über NFC", "Gar nicht"]
  answer: { index: 1 }
  explanation: "Über die Funkmasten des Anbieters."
- key: q9
  type: single_choice
  prompt: "Welche Verbindungsart ist stromsparend, aber zu langsam für Videos?"
  options: ["LAN", "WLAN", "Bluetooth", "5G"]
