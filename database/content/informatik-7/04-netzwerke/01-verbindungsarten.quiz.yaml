  explanation: "Nähe und Langlebigkeit sind die Stärken des Analogen."
- key: q12
  type: single_choice
  prompt: "Ein Termin soll an 30 Personen gehen. Welche Form ist am effizientesten?"
  options: ["30 Briefe", "Eine E-Mail an alle", "30 Telefonate", "30 Besuche"]
  answer: { index: 1 }
  explanation: "Digital ist bei Reichweite und Tempo unschlagbar."
