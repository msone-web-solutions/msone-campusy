name: Jesus und seine Nachfolge
description: Jesus als Jude seiner Zeit, seine Botschaft in Bergpredigt und Vaterunser, Menschen, die ihm nachgefolgt sind, sowie Schuld, Vergebung und Barmherzigkeit im eigenen Handeln.
curriculum_ref: "Fachlehrplan Sekundarschule Evangelischer Religionsunterricht, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Christologie: Jesu Wirken und seine Botschaft in Lebensgeschichten“ und „Ethik: Konsequenzen persönlichen Handelns aus der Perspektive des christlichen Glaubens“"
