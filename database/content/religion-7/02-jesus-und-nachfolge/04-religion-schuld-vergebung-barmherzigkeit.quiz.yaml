- key: q1
  type: single_choice
  prompt: "Was ist das Gewissen?"
  options: ["Ein Gesetzbuch", "Die innere Stimme, die sich meldet, wenn wir gegen unsere Werte verstoßen", "Ein Gebet", "Die Meinung der Freunde"]
  answer: { index: 1 }
  explanation: "Das Gewissen wird durch Umfeld und Glauben geprägt und meldet sich bei Verstößen."
- key: q2
  type: gap_text
  prompt: "Der griechische Begriff für Umkehr, ___, bedeutet wörtlich „Umdenken“."
  answer:
    gaps:
      - ["metanoia", "Metanoia"]
  explanation: "Umkehr heißt, den Fehler zu erkennen und die Richtung zu ändern."
- key: q3
  type: single_choice
  prompt: "Welche Reihenfolge beschreibt den Weg der Schuldbewältigung richtig?"
  options: ["Vergessen – Verdrängen – Weitermachen", "Erkennen – Bekennen – Wiedergutmachen – Vergebung annehmen", "Beschuldigen – Streiten – Trennen", "Bekennen – Verstecken – Vergessen"]
  answer: { index: 1 }
  explanation: "Schuld lässt sich nicht ungeschehen machen, aber in diesen Schritten bewältigen."
- key: q4
  type: true_false
  prompt: "Vergebung bedeutet, dass die Tat vergessen wird und egal war."
  answer: { value: false }
  explanation: "Vergebung heißt, dass die Schuld nicht mehr zwischen den Menschen steht – nicht, dass sie egal war."
- key: q5
  type: single_choice
  prompt: "Wie reagiert der Vater im Gleichnis vom verlorenen Sohn auf die Rückkehr seines Sohnes?"
  options: ["Er bestraft ihn.", "Er lässt ihn als Knecht arbeiten.", "Er läuft ihm entgegen, umarmt ihn und feiert ein Fest.", "Er schickt ihn weg."]
  answer: { index: 2 }
  explanation: "Das Gleichnis zeigt, dass Gott darauf wartet zu vergeben."
- key: q6
  type: multiple_choice
  prompt: "Welche gehören zu den Werken der Barmherzigkeit aus Mt 25?"
  options: ["Hungrige speisen", "Kranke besuchen", "Reiche beschenken", "Fremde beherbergen"]
  answer: { indexes: [0, 1, 3] }
  explanation: "Die Werke richten sich an Bedürftige: Hungrige, Durstige, Fremde, Nackte, Kranke, Gefangene."
- key: q7
  type: single_choice
  prompt: "Wie heißt das evangelische Hilfswerk gegen Hunger und Armut weltweit?"
  options: ["Misereor", "Brot für die Welt", "Caritas", "Die Tafeln"]
  answer: { index: 1 }
  explanation: "Brot für die Welt ist evangelisch, Misereor das katholische Gegenstück."
- key: q8
  type: gap_text
  prompt: "Die organisierte Hilfe für Bedürftige, etwa Tafeln und Wärmestuben, gehört zur ___ der evangelischen Kirche."
  answer:
    gaps:
      - ["Diakonie"]
  explanation: "Diakonie ist der Dienst der Kirche an Menschen in Not."
