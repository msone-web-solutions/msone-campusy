name: Kirche und Hoffnung
description: Die Reformation in Mitteldeutschland, evangelisch und katholisch heute, Konfirmation und andere Übergangsfeiern sowie das Nachdenken über Sterben, Tod und die christliche Auferstehungshoffnung.
curriculum_ref: "Fachlehrplan Sekundarschule Evangelischer Religionsunterricht, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Kirchengeschichte/Ekklesiologie: Kirche in konfessioneller Differenzierung“ und „Eschatologie: Hoffnung über den Tod hinaus“"
