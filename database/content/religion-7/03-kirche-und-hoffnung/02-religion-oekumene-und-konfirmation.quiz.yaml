- key: q1
  type: single_choice
  prompt: "Was wurde im Augsburger Religionsfrieden 1555 festgelegt?"
  options: ["Alle Deutschen müssen katholisch sein.", "Der Landesherr bestimmt die Konfession seines Landes.", "Luther wird Papst.", "Die Bibel wird verboten."]
  answer: { index: 1 }
  explanation: "So entstand ein Nebeneinander evangelischer und katholischer Gebiete."
- key: q2
  type: multiple_choice
  prompt: "Was haben evangelische und katholische Kirche gemeinsam?"
  options: ["Die Bibel", "Das Vaterunser", "Den Papst als Oberhaupt", "Die Taufe"]
  answer: { indexes: [0, 1, 3] }
  explanation: "Den Papst gibt es nur in der katholischen Kirche."
- key: q3
  type: gap_text
  prompt: "Die beiden evangelischen Sakramente sind die Taufe und das ___."
  answer:
    gaps:
      - ["Abendmahl"]
  explanation: "Beide hat Jesus selbst eingesetzt."
- key: q4
  type: true_false
  prompt: "In der evangelischen Kirche können Frauen Pfarrerin und Bischöfin werden."
  answer: { value: true }
  explanation: "In der katholischen Kirche werden dagegen nur Männer zu Priestern geweiht."
- key: q5
  type: single_choice
  prompt: "Was bedeutet „Ökumene“?"
  options: ["Der Streit zwischen den Kirchen", "Das Bemühen der christlichen Kirchen um Einheit und Zusammenarbeit", "Die Trennung der Kirchen", "Ein katholisches Sakrament"]
  answer: { index: 1 }
  explanation: "oikumene = die ganze bewohnte Erde."
- key: q6
  type: single_choice
  prompt: "In welchem Alter werden evangelische Jugendliche in der Regel konfirmiert?"
  options: ["mit etwa 7 Jahren", "mit etwa 14 Jahren", "mit 18 Jahren", "als Säugling"]
  answer: { index: 1 }
  explanation: "Die Konfirmation findet meist mit 14 nach dem Konfirmandenunterricht statt."
- key: q7
  type: single_choice
  prompt: "Welches ist das katholische Gegenstück zur Konfirmation?"
  options: ["Die Erstkommunion", "Die Firmung", "Die Krankensalbung", "Die Priesterweihe"]
  answer: { index: 1 }
  explanation: "Die Firmung ist ein Sakrament und wird vom Bischof gespendet."
- key: q8
  type: gap_text
  prompt: "Die nichtreligiöse Feier mit 14 Jahren, die in der DDR gefördert wurde und in Sachsen-Anhalt verbreitet ist, heißt ___."
  answer:
    gaps:
      - ["Jugendweihe"]
  explanation: "Die Jugendweihe wird heute von Vereinen angeboten."
