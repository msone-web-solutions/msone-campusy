name: Wärmelehre
description: Teilchenmodell, Längen- und Volumenänderung bei Erwärmung, Anomalie des Wassers, Aggregatzustände und Wetterphänomene, Wärme, spezifische Wärmekapazität, Grundgleichung der Wärmelehre und Hauptsätze.
curriculum_ref: "Fachlehrplan Sekundarschule Physik, Schuljahrgänge 7/8 – Kompetenzschwerpunkt „Wärmewirkungen erklären und Wärmeaustauschprozesse bilanzieren“"
