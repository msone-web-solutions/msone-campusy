- key: q1
  type: single_choice
  prompt: "Wie berechnet man den Druck?"
  options: ["p = F · A", "p = F : A", "p = A : F", "p = m · g"]
  answer: { index: 1 }
  explanation: "Druck ist Kraft geteilt durch Fläche: p = F : A."
- key: q2
  type: single_choice
  prompt: "Welche Einheit hat der Druck?"
  options: ["Newton (N)", "Pascal (Pa)", "Joule (J)", "Kilogramm (kg)"]
  answer: { index: 1 }
  explanation: "1 Pa = 1 N/m². Gebräuchlich sind auch hPa, kPa und bar."
- key: q3
  type: numeric
  prompt: "Ein Schrank drückt mit 900 N auf 0,3 m² Bodenfläche. Berechne den Auflagedruck in Pa."
  answer: { value: 3000, tolerance: 5 }
  options: { unit: "Pa" }
  explanation: "p = F : A = 900 N : 0,3 m² = 3000 Pa."
- key: q4
  type: multiple_choice
  prompt: "Womit verringert man den Druck auf den Untergrund?"
  options: ["Skier", "Raupenketten beim Bagger", "Stöckelabsätze", "Breite Traktorreifen"]
  answer: { indexes: [0, 1, 3] }
  explanation: "Große Auflageflächen verkleinern den Druck. Stöckelabsätze haben eine winzige Fläche und erzeugen sehr hohen Druck."
- key: q5
  type: true_false
  prompt: "Der Schweredruck in einer Flüssigkeit hängt von der Form des Gefäßes ab."
  answer: { value: false }
  explanation: "Der Schweredruck hängt nur von der Tiefe und der Dichte der Flüssigkeit ab – nicht von der Gefäßform oder der Wassermenge."
- key: q6
  type: numeric
  prompt: "Wie groß ist der normale Luftdruck auf Meereshöhe ungefähr in hPa?"
  answer: { value: 1013, tolerance: 15 }
  options: { unit: "hPa" }
  explanation: "Der Normalluftdruck beträgt etwa 1013 hPa, also rund 1 bar."
- key: q7
  type: gap_text
  prompt: "Der Luftdruck wird mit dem ___ gemessen. Otto von Guericke zeigte den Luftdruck 1657 mit den ___ Halbkugeln."
  answer:
    gaps:
      - ["Barometer"]
      - ["Magdeburger"]
  explanation: "Barometer messen den Luftdruck; Guerickes Versuch mit den Magdeburger Halbkugeln wurde weltberühmt."
- key: q8
  type: single_choice
  prompt: "Ein Taucher merkt beim Abtauchen, dass der Druck auf die Ohren zunimmt. Woran liegt das?"
  options: ["Das Wasser wird kälter", "Mit der Tiefe lastet mehr Wasser über ihm – der Schweredruck steigt", "Der Luftdruck wird unter Wasser größer", "Seine Masse nimmt zu"]
  answer: { index: 1 }
  explanation: "Pro 10 m Wassertiefe steigt der Schweredruck um etwa 1 bar, weil das Gewicht der Wassersäule darüber zunimmt."
