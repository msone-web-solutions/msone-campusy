name: Kräfte und ihre Wirkungen
description: Volumen, Masse und Dichte messen und berechnen, Kräfte an ihren Wirkungen erkennen und messen, Gewichtskraft, Kräfte zusammensetzen und Gleichgewicht, Druck in festen Körpern, Flüssigkeiten und Gasen sowie Auftrieb.
curriculum_ref: "Fachlehrplan Sekundarschule Physik, Schuljahrgänge 7/8 – Kompetenzschwerpunkt „Kräfte und ihre Wirkungen beobachten und vorhersagen“"
