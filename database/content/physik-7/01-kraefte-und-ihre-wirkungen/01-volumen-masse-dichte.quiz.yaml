- key: q1
  type: single_choice
  prompt: "Mit welchem Gerät misst man die Masse eines Körpers?"
  options: ["Messzylinder", "Waage", "Federkraftmesser", "Thermometer"]
  answer: { index: 1 }
  explanation: "Die Masse wird mit einer Waage gemessen. Der Messzylinder misst Volumen, der Federkraftmesser Kräfte."
- key: q2
  type: single_choice
  prompt: "Welche Einheit gehört zur Dichte?"
  options: ["kg", "cm³", "g/cm³", "N"]
  answer: { index: 2 }
  explanation: "Dichte = Masse : Volumen, also z. B. g/cm³ oder kg/m³."
- key: q3
  type: numeric
  prompt: "Ein Holzklotz hat die Masse 250 g und das Volumen 500 cm³. Berechne die Dichte in g/cm³."
  answer: { value: 0.5, tolerance: 0.01 }
  options: { unit: "g/cm³" }
  explanation: "ρ = m : V = 250 g : 500 cm³ = 0,5 g/cm³."
- key: q4
  type: numeric
  prompt: "Ein Aluminiumwürfel (Dichte 2,7 g/cm³) hat das Volumen 10 cm³. Welche Masse hat er in g?"
  answer: { value: 27, tolerance: 0.1 }
  options: { unit: "g" }
  explanation: "m = ρ · V = 2,7 g/cm³ · 10 cm³ = 27 g."
- key: q5
  type: true_false
  prompt: "Ein großer Eisenblock hat eine höhere Dichte als ein kleiner Eisennagel."
  answer: { value: false }
  explanation: "Die Dichte ist eine Stoffeigenschaft. Beide bestehen aus Eisen und haben dieselbe Dichte von etwa 7,9 g/cm³."
- key: q6
  type: gap_text
  prompt: "Die Dichte berechnet man, indem man die ___ durch das ___ teilt."
  answer:
    gaps:
      - ["Masse"]
      - ["Volumen"]
  explanation: "ρ = m : V – Masse geteilt durch Volumen."
- key: q7
  type: numeric
  prompt: "Ein Messzylinder enthält 80 ml Wasser. Nach dem Eintauchen eines Metallstücks zeigt er 92 ml an. Welches Volumen hat das Metallstück in cm³?"
  answer: { value: 12, tolerance: 0.1 }
  options: { unit: "cm³" }
  explanation: "92 ml − 80 ml = 12 ml = 12 cm³ (1 ml = 1 cm³)."
- key: q8
  type: multiple_choice
  prompt: "Welche Ursachen können zu Messabweichungen bei der Dichtebestimmung führen?"
  options: ["Luftbläschen haften am Körper", "Der Messzylinder wird ungenau abgelesen", "Der Körper hat eine Farbe", "Am Körper hängen Wassertropfen, wenn er gewogen wird"]
  answer: { indexes: [0, 1, 3] }
  explanation: "Luftbläschen und ungenaues Ablesen verfälschen das Volumen, Wassertropfen die Masse. Die Farbe spielt keine Rolle."
