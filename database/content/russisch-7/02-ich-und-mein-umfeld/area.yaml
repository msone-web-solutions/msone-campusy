name: Ich und mein Umfeld
description: Sich begrüßen und vorstellen, über Familie, Freunde und den Klassenraum sprechen – mit den ersten grammatischen Grundlagen (Genus, Personal- und Possessivpronomen, Verneinung, fehlendes „ist“).
curriculum_ref: "Fachlehrplan Sekundarschule Russisch, Schuljahrgänge 7/8 – Kommunikative Inhalte „eigene Person und soziales Umfeld“; Kommunikationsabsichten: Begrüßung, Anrede, Verabschiedung, Vorstellung der eigenen Person und anderer Personen"
