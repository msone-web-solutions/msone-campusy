name: Das Vereinigte Königreich und die USA
description: Landesteile, Städte und Landschaften Großbritanniens, Schule und Traditionen im UK, Staaten und Naturwunder der USA, Zusammenleben in einer multikulturellen und digitalen Gesellschaft.
curriculum_ref: "Fachlehrplan Sekundarschule Englisch, Schuljahrgänge 7/8 – Interkulturelle Kompetenzen: soziokulturelles Orientierungswissen (Lebensweisen, Traditionen, geografische und gesellschaftliche Aspekte UK und USA); Kommunikative Inhalte: Schulsysteme, Kultur, Medienhandeln"
