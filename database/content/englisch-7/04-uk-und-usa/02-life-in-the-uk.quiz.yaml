  explanation: "Im UK wird links gefahren."
- key: q7
  type: single_choice
  prompt: "Was ist ein „form tutor“?"
  options: ["Der Schulleiter", "Der Klassenlehrer", "Der Hausmeister", "Ein Nachhilfelehrer"]
