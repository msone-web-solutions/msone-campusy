- key: q8
  type: single_choice
  prompt: "Was bedeutet interkulturelle Kompetenz beim Vergleich von Schulsystemen?"
  options: ["Das eigene System ist immer besser.", "Unterschiede erkennen und verstehen, ohne zu bewerten.", "Das andere System übernehmen.", "Unterschiede ignorieren."]
