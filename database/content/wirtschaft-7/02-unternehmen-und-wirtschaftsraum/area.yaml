name: Unternehmen, Berufe und regionaler Wirtschaftsraum
description: Aufgaben von Unternehmen, Wirtschaftssektoren, betriebliche Grundfunktionen, Arbeitsteilung, Arbeitsplätze und Berufe sowie Standortfaktoren, Import und Export im regionalen Wirtschaftsraum.
curriculum_ref: "Fachlehrplan Sekundarschule Wirtschaft, Schuljahrgänge 7/8 – Kompetenzschwerpunkte „Berufe und Arbeitsplätze in Unternehmen der Region erkunden“ und „Den regionalen Wirtschaftsraum untersuchen“"
