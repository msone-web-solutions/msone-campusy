- key: q3
  type: numeric
  prompt: "Löse: 4x + 5 = 33"
  answer: { value: 7 }
  explanation: "| − 5 → 4x = 28 | : 4 → x = 7."
- key: q4
  type: numeric
  prompt: "Löse: 7x − 10 = 39"
  answer: { value: 7 }
