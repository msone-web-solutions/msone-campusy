name: Terme und lineare Gleichungen
description: Mit Variablen rechnen, Terme vereinfachen und lineare Gleichungen der Form ax + b = c sicher lösen – auch in Sachaufgaben.
curriculum_ref: "Fachlehrplan Sekundarschule Mathematik, Schuljahrgänge 7/8 – Kompetenzschwerpunkt „Lineare Gleichungen“ sowie Einstieg in „Arbeiten mit Variablen, Gleichungen und Formeln“ (Inhaltsbereich Zahlen und Größen)"
