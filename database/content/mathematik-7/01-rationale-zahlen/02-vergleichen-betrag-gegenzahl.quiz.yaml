- key: q1
  type: single_choice
  prompt: "Welche Zahl ist größer: −3 oder −8?"
  options: ["−3", "−8", "Beide sind gleich groß"]
  answer: { index: 0 }
  explanation: "−3 liegt näher an der Null (weiter rechts) und ist deshalb größer als −8."

- key: q2
  type: numeric
  prompt: "Berechne den Betrag: |−12| = ?"
  answer: { value: 12 }
  explanation: "Der Betrag ist der Abstand zur Null, er ist immer positiv: |−12| = 12."

- key: q3
  type: numeric
  prompt: "Wie heißt die Gegenzahl von 9?"
  answer: { value: -9 }
  explanation: "Die Gegenzahl hat den gleichen Betrag und das andere Vorzeichen: −9."

- key: q4
  type: numeric
  prompt: "Wie heißt die Gegenzahl von −2,5?"
  answer: { value: 2.5 }
  explanation: "Vorzeichen umdrehen: aus −2,5 wird 2,5."

- key: q5
  type: single_choice
  prompt: "Welche Reihe ist richtig aufsteigend geordnet (von klein nach groß)?"
  options:
    - "−1 < −4 < 0 < 2"
    - "−4 < −1 < 0 < 2"
    - "0 < −1 < −4 < 2"
    - "2 < 0 < −1 < −4"
  answer: { index: 1 }
  explanation: "Zuerst die kleinste negative Zahl (−4), dann −1, dann 0, dann die positive 2."

- key: q6
  type: true_false
  prompt: "Der Betrag einer Zahl kann negativ sein."
  answer: { value: false }
  explanation: "Der Betrag ist ein Abstand – und ein Abstand ist nie negativ."

- key: q7
  type: multiple_choice
  prompt: "Welche Aussagen sind wahr?"
  options:
    - "−10 < −1"
    - "0 > −5"
    - "|−7| = −7"
    - "Die Gegenzahl von 0 ist 0."
    - "−2 > 1"
  answer: { indexes: [0, 1, 3] }
  explanation: "−10 liegt links von −1 (wahr). 0 ist größer als jede negative Zahl (wahr). |−7| = 7, nicht −7 (falsch). Die Gegenzahl von 0 ist 0 (wahr). −2 ist kleiner als 1 (falsch)."

- key: q8
  type: gap_text
  prompt: "Setze < oder > ein: −6 ___ −2 und 3 ___ −9"
  answer:
    gaps:
      - ["<"]
      - [">"]
  explanation: "−6 liegt links von −2, also −6 < −2. Die positive 3 ist größer als die negative −9, also 3 > −9."

- key: q9
  type: single_choice
  prompt: "Welche Zahl hat den gleichen Betrag wie −4,5?"
  options: ["−5,4", "4,5", "0,45", "−45"]
  answer: { index: 1 }
  explanation: "|−4,5| = 4,5 und |4,5| = 4,5. Das ist die Gegenzahl."

- key: q10
  type: single_choice
  prompt: "In Magdeburg sind es −7 °C, in Halle −4 °C, in Dessau −9 °C. Wo ist es am kältesten?"
  options: ["Magdeburg", "Halle", "Dessau"]
  answer: { index: 2 }
  explanation: "Die kleinste Zahl ist die kälteste Temperatur: −9 < −7 < −4. Also Dessau."
