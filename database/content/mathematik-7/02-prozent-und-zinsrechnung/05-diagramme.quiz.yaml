- key: q1
  type: numeric
  prompt: "Wie viel Grad entspricht ein Anteil von 25 % im Kreisdiagramm?"
  options: { unit: "°" }
  answer: { value: 90 }
  explanation: "25 % von 360° = 90°."
- key: q2
  type: numeric
  prompt: "Ein Kreissektor hat 72°. Wie viel Prozent sind das? (nur die Zahl)"
  options: { unit: "%" }
  answer: { value: 20 }
  explanation: "72 : 3,6 = 20 %."
- key: q3
  type: numeric
  prompt: "Wie viel Grad entsprechen 35 %? (nur die Zahl)"
  options: { unit: "°" }
  answer: { value: 126 }
  explanation: "35 · 3,6° = 126°."
- key: q4
  type: single_choice
  prompt: "Welches Diagramm eignet sich am besten, um die Temperatur im Verlauf eines Tages darzustellen?"
  options: ["Kreisdiagramm", "Säulendiagramm", "Liniendiagramm"]
  answer: { index: 2 }
  explanation: "Ein Liniendiagramm zeigt Veränderungen über die Zeit."
- key: q5
  type: single_choice
  prompt: "Welches Diagramm eignet sich am besten, um zu zeigen, wie sich die Stimmen bei einer Klassensprecherwahl auf die Kandidaten verteilen?"
  options: ["Kreisdiagramm", "Liniendiagramm", "Zahlengerade"]
  answer: { index: 0 }
  explanation: "Ein Kreisdiagramm zeigt, wie sich ein Ganzes (alle Stimmen) aufteilt."
- key: q6
  type: numeric
  prompt: "Von 30 Kindern wählen 12 Pizza als Lieblingsessen. Wie groß ist der Winkel des Sektors „Pizza“ im Kreisdiagramm?"
  options: { unit: "°" }
  answer: { value: 144 }
  explanation: "12/30 = 40 %, 40 · 3,6° = 144° (oder 360° : 30 · 12 = 144°)."
- key: q7
  type: true_false
  prompt: "Die Winkel aller Sektoren eines Kreisdiagramms ergeben zusammen 360°."
  answer: { value: true }
  explanation: "Der ganze Kreis (100 %) hat 360°."
- key: q8
  type: multiple_choice
  prompt: "Worauf musst du beim Lesen eines Diagramms achten, damit du nicht getäuscht wirst?"
  options:
    - "Beginnt die y-Achse bei 0?"
    - "Ist die Gesamtzahl angegeben?"
    - "Ist das Diagramm bunt?"
    - "Sind die Werte gerundet?"
  answer: { indexes: [0, 1, 3] }
  explanation: "Achsen, Gesamtzahl und Rundung beeinflussen die Aussage – die Farbe nicht."
- key: q9
  type: numeric
  prompt: "In einem Kreisdiagramm haben drei Sektoren 90°, 126° und 54°. Wie viel Prozent hat der vierte Sektor? (nur die Zahl)"
  options: { unit: "%" }
  answer: { value: 25 }
  explanation: "360° − 90° − 126° − 54° = 90° → 90 : 3,6 = 25 %."
- key: q10
  type: numeric
  prompt: "Bei einer Umfrage unter 200 Personen zeigt das Säulendiagramm für „Fahrrad“ 35 %. Wie viele Personen sind das?"
  answer: { value: 70 }
  explanation: "35 % von 200 = 70 Personen."
