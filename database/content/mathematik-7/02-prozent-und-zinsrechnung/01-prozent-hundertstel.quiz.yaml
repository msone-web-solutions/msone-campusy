- key: q1
  type: single_choice
  prompt: "Was bedeutet 1 %?"
  options: ["ein Zehntel", "ein Hundertstel", "ein Tausendstel", "eins"]
  answer: { index: 1 }
  explanation: "Prozent = „von Hundert“. 1 % = 1/100."
- key: q2
  type: numeric
  prompt: "Schreibe 45 % als Dezimalzahl."
  answer: { value: 0.45 }
  explanation: "45 : 100 = 0,45."
- key: q3
  type: numeric
  prompt: "Schreibe 0,08 als Prozentsatz (nur die Zahl)."
  options: { unit: "%" }
  answer: { value: 8 }
  explanation: "0,08 · 100 = 8 %."
- key: q4
  type: numeric
  prompt: "Wie viel Prozent sind 3/4? (nur die Zahl)"
  options: { unit: "%" }
  answer: { value: 75 }
  explanation: "3/4 = 75/100 = 75 %."
- key: q5
  type: numeric
  prompt: "Schreibe 20 % als gekürzten Bruch."
  answer: { value: "1/5" }
  explanation: "20/100 = 1/5."
- key: q6
  type: single_choice
  prompt: "Welche Angabe ist am größten?"
  options: ["0,4", "3/8", "45 %", "2/5"]
  answer: { index: 2 }
  explanation: "0,4 = 40 %, 3/8 = 37,5 %, 2/5 = 40 %. Am größten ist 45 %."
- key: q7
  type: numeric
  prompt: "In einer Klasse mit 20 Kindern haben 7 ein Fahrrad dabei. Wie viel Prozent sind das? (nur die Zahl)"
  options: { unit: "%" }
  answer: { value: 35 }
  explanation: "7/20 = 35/100 = 35 %."
- key: q8
  type: true_false
  prompt: "150 % ist mehr als das Ganze."
  answer: { value: true }
  explanation: "100 % ist das Ganze, 150 % = 1,5 ist das Anderthalbfache."
- key: q9
  type: multiple_choice
  prompt: "Welche Angaben bedeuten dasselbe wie 25 %?"
  options: ["1/4", "0,25", "2,5", "25/100", "1/25"]
  answer: { indexes: [0, 1, 3] }
  explanation: "25 % = 25/100 = 1/4 = 0,25. 2,5 wäre 250 %, 1/25 = 4 %."
- key: q10
  type: numeric
  prompt: "Wie viel Prozent sind 7/8? (nur die Zahl, mit Komma)"
  options: { unit: "%" }
  answer: { value: 87.5 }
  explanation: "7 : 8 = 0,875 = 87,5 %."
