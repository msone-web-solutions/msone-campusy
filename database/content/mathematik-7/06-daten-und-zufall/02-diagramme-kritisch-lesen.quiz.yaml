- key: q1
  type: single_choice
  prompt: "Welches Diagramm passt, um die Anzahl der Unfälle pro Jahr über 10 Jahre zu zeigen?"
  options: ["Kreisdiagramm", "Liniendiagramm", "Strichliste"]
  answer: { index: 1 }
  explanation: "Ein Verlauf über die Zeit → Liniendiagramm."
- key: q2
  type: single_choice
  prompt: "Welches Diagramm passt, um zu zeigen, wie sich die Verkehrsmittel der 7a (zu Fuß, Rad, Bus, Auto) aufteilen?"
  options: ["Liniendiagramm", "Kreisdiagramm", "Zahlengerade"]
  answer: { index: 1 }
  explanation: "Anteile an einem Ganzen → Kreisdiagramm (Säulendiagramm ginge auch)."
- key: q3
  type: single_choice
  prompt: "Ein Säulendiagramm hat eine y-Achse, die bei 95 beginnt. Die Säulen zeigen 96 und 100. Was ist das Problem?"
  options:
    - "Kein Problem, das ist übersichtlich."
    - "Die abgeschnittene Achse lässt den kleinen Unterschied riesig aussehen."
    - "Die Säulen sind zu breit."
  answer: { index: 1 }
  explanation: "Eine Achse, die nicht bei 0 beginnt, übertreibt Unterschiede."
- key: q4
  type: multiple_choice
  prompt: "Was gehört zu einem sauber gezeichneten Diagramm?"
  options: ["Überschrift", "Achsenbeschriftung mit Einheit", "Gleichmäßige Skala ab 0", "Möglichst viele Farben", "Gleiche Säulenbreite"]
  answer: { indexes: [0, 1, 2, 4] }
  explanation: "Überschrift, Beschriftung, Skala und gleiche Säulen – Farbenvielfalt ist kein Qualitätsmerkmal."
- key: q5
  type: numeric
  prompt: "Fahrradunfälle: 2022 waren es 50, 2024 sind es 40. Um wie viel Prozent sind sie gesunken? (nur die Zahl)"
  options: { unit: "%" }
  answer: { value: 20 }
  explanation: "10 weniger von 50: 10/50 = 20 %."
- key: q6
  type: single_choice
  prompt: "Ein Bild-Diagramm zeigt den Umsatz: Das zweite Geldsäckchen ist doppelt so hoch und doppelt so breit wie das erste. Wie wirkt das?"
  options:
    - "Der Umsatz wirkt doppelt so groß – korrekt."
    - "Der Umsatz wirkt viermal so groß, weil die Fläche vierfach ist."
    - "Der Umsatz wirkt halb so groß."
  answer: { index: 1 }
  explanation: "Doppelte Höhe und Breite = vierfache Fläche. Das Auge sieht die Fläche."
- key: q7
  type: single_choice
  prompt: "Stadt A: 300 Unfälle bei 600 000 Einwohnern. Stadt B: 100 Unfälle bei 100 000 Einwohnern. Wo ist die Unfallrate höher?"
  options: ["Stadt A", "Stadt B", "Gleich"]
  answer: { index: 1 }
  explanation: "A: 300/600 000 = 0,05 %. B: 100/100 000 = 0,1 %. B hat die höhere Rate, obwohl A mehr Unfälle hat."
- key: q8
  type: true_false
  prompt: "Ein 3D-Kreisdiagramm zeigt die Anteile genauso genau wie ein flaches."
  answer: { value: false }
  explanation: "Die Perspektive lässt vordere Stücke größer erscheinen."
- key: q9
  type: numeric
  prompt: "In einem Kreisdiagramm ist h(Bus) = 0,2. Wie groß ist der Winkel des Sektors?"
  options: { unit: "°" }
  answer: { value: 72 }
  explanation: "0,2 · 360° = 72°."
- key: q10
  type: multiple_choice
  prompt: "Welche Fragen gehören zur Checkliste beim kritischen Lesen eines Diagramms?"
  options: ["Beginnt die Achse bei 0?", "Wie groß ist n?", "Ist das Diagramm schön?", "Welcher Zeitraum ist gezeigt?", "Wer hat es erstellt und warum?"]
  answer: { indexes: [0, 1, 3, 4] }
  explanation: "Achse, Gesamtzahl, Zeitraum und Urheber – ob es schön ist, sagt nichts über die Aussage."
- key: q11
  type: single_choice
  prompt: "Ein Liniendiagramm zeigt: 2021: 48, 2022: 41, 2023: 44, 2024: 35 Unfälle. Wie beschreibt man den Trend am besten?"
  options: ["Steigend", "Gleichbleibend", "Insgesamt fallend mit einem Anstieg 2023"]
  answer: { index: 2 }
  explanation: "Von 48 auf 35 ist fallend, 2023 gab es einen zwischenzeitlichen Anstieg."
- key: q12
  type: single_choice
  prompt: "Auf einer y-Achse stehen die Werte 0, 1, 2, 3, 10, 20, 30 mit gleichen Abständen. Was stimmt hier nicht?"
  options: ["Die Skala ist ungleichmäßig", "Die Achse beginnt nicht bei 0", "Es fehlt die Überschrift"]
  answer: { index: 0 }
  explanation: "Erst 1er-, dann 10er-Schritte bei gleichem Abstand – die Kurve wird verzerrt."
